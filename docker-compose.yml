version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.26
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
      SERVICES: "frontend:history:matching:worker"
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "localhost:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  temporal-ui:
    image: temporalio/ui:2.27.0
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC (traces in)

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

  server:
    profiles: ["app", "all"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_HOST: temporal:7233
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    depends_on:
      temporal:
        condition: service_healthy
      jaeger:
        condition: service_started

  worker:
    profiles: ["app", "all"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      TEMPORAL_HOST: temporal:7233
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    depends_on:
      temporal:
        condition: service_healthy
      jaeger:
        condition: service_started

