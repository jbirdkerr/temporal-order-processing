global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "order-server"
    static_configs:
      - targets:
          - "server:8080"
          - "host.docker.internal:8080"
    metrics_path: /metrics

  - job_name: "order-worker"
    static_configs:
      - targets:
          - "worker:9091"
          - "host.docker.internal:9091"
    metrics_path: /metrics
